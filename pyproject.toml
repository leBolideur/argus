[project]
name = "argus"
version = "0.1.0"
description = "Argus transforms disconnected data into connected knowledge."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "typer>=0.27.0",
]

[tool.uv]
package = true

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
